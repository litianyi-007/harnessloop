<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Harnessloop five gate overview</title>
  <desc id="desc">A five-step overview: Setup, Contracts, Scope-lock, Evidence, Review and feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .node { fill: #fffdf7; stroke-width: 3; rx: 8; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="320" fill="#f8fafc"/>
  <rect x="45" y="92" width="180" height="120" class="node" stroke="#0f766e"/>
  <text x="135" y="137" text-anchor="middle" class="title">Setup</text>
  <text x="135" y="165" text-anchor="middle" class="body">data, tools, access</text>
  <rect x="275" y="92" width="180" height="120" class="node" stroke="#b45309"/>
  <text x="365" y="137" text-anchor="middle" class="title">Contracts</text>
  <text x="365" y="165" text-anchor="middle" class="body">goal and thresholds</text>
  <rect x="505" y="92" width="180" height="120" class="node" stroke="#1d4ed8"/>
  <text x="595" y="137" text-anchor="middle" class="title">Scope-lock</text>
  <text x="595" y="165" text-anchor="middle" class="body">smallest change</text>
  <rect x="735" y="92" width="180" height="120" class="node" stroke="#991b1b"/>
  <text x="825" y="137" text-anchor="middle" class="title">Evidence</text>
  <text x="825" y="165" text-anchor="middle" class="body">static, runtime, source</text>
  <rect x="965" y="92" width="190" height="120" class="node" stroke="#4d7c0f"/>
  <text x="1060" y="137" text-anchor="middle" class="title">Review</text>
  <text x="1060" y="165" text-anchor="middle" class="body">feedback, continue</text>
  <path d="M225 152 L275 152" class="line"/>
  <path d="M455 152 L505 152" class="line"/>
  <path d="M685 152 L735 152" class="line"/>
  <path d="M915 152 L965 152" class="line"/>
  <path d="M1060 212 C1060 278 135 278 135 212" class="line"/>
  <text x="600" y="295" text-anchor="middle" class="body">Self-audit watches the loop for drift, contradictions, and dead loops.</text>
</svg>

