<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Harnessloop evidence cycle</title>
  <desc id="desc">A product hero illustration for Harnessloop: five evidence gates orbit a balanced yin-yang inspired control loop.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#fbfbf7"/>
      <stop offset="62%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#ebe3d2"/>
    </radialGradient>
    <radialGradient id="ink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27364f"/>
    </marker>
    <style>
      .label { font: 600 28px Arial, sans-serif; fill: #142033; }
      .small { font: 18px Arial, sans-serif; fill: #4b5563; }
      .gate { fill: #fffaf0; stroke-width: 3; }
      .line { fill: none; stroke: #27364f; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); opacity: .72; }
      .wash { opacity: .16; filter: url(#soft); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="280" cy="170" r="170" fill="#0f766e" class="wash"/>
  <circle cx="1320" cy="710" r="190" fill="#991b1b" class="wash"/>
  <circle cx="1250" cy="180" r="150" fill="#1d4ed8" class="wash"/>
  <circle cx="430" cy="735" r="160" fill="#b45309" class="wash"/>

  <circle cx="800" cy="450" r="205" fill="none" stroke="#111827" stroke-width="7" opacity=".86"/>
  <path d="M800 245 A205 205 0 0 1 800 655 A102.5 102.5 0 0 0 800 450 A102.5 102.5 0 0 1 800 245" fill="url(#ink)" opacity=".93"/>
  <path d="M800 245 A205 205 0 0 0 800 655 A102.5 102.5 0 0 1 800 450 A102.5 102.5 0 0 0 800 245" fill="#fbfaf4" opacity=".98"/>
  <circle cx="800" cy="348" r="22" fill="#fbfaf4"/>
  <circle cx="800" cy="552" r="22" fill="#111827"/>

  <path d="M800 118 C1010 118 1188 252 1260 434" class="line"/>
  <path d="M1302 500 C1270 700 1088 820 884 826" class="line"/>
  <path d="M725 818 C515 784 365 635 340 430" class="line"/>
  <path d="M368 350 C435 170 600 102 770 118" class="line"/>

  <circle cx="800" cy="118" r="74" class="gate" stroke="#0f766e"/>
  <text x="800" y="110" text-anchor="middle" class="label">Setup</text>
  <text x="800" y="138" text-anchor="middle" class="small">sources</text>

  <circle cx="1268" cy="450" r="74" class="gate" stroke="#b45309"/>
  <text x="1268" y="442" text-anchor="middle" class="label">Contract</text>
  <text x="1268" y="470" text-anchor="middle" class="small">thresholds</text>

  <circle cx="1016" cy="790" r="74" class="gate" stroke="#1d4ed8"/>
  <text x="1016" y="782" text-anchor="middle" class="label">Scope</text>
  <text x="1016" y="810" text-anchor="middle" class="small">minimal</text>

  <circle cx="584" cy="790" r="74" class="gate" stroke="#991b1b"/>
  <text x="584" y="782" text-anchor="middle" class="label">Evidence</text>
  <text x="584" y="810" text-anchor="middle" class="small">runtime</text>

  <circle cx="332" cy="450" r="74" class="gate" stroke="#4d7c0f"/>
  <text x="332" y="442" text-anchor="middle" class="label">Review</text>
  <text x="332" y="470" text-anchor="middle" class="small">feedback</text>

  <text x="800" y="414" text-anchor="middle" class="label" fill="#f8fafc">Harnessloop</text>
  <text x="800" y="485" text-anchor="middle" class="small" fill="#1f2937">evidence-gated long tasks</text>
</svg>

