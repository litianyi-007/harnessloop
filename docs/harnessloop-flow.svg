<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1060" viewBox="0 0 1520 1060" role="img" aria-labelledby="title desc">
  <title id="title">Harnessloop detailed protocol flow</title>
  <desc id="desc">Detailed Harnessloop flow including existing session takeover, intake gate, setup, goal breakdown, evidence contracts, scoped rounds, adversarial review, self-audit, feedback, and evolution issues.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
      .agent { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .review { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .control { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 8; }
      .audit { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 8; }
      .issue { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .done { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .blocked { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 8; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #be123c; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .text { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 13px Arial, sans-serif; fill: #334155; }
      .issueLabel { font: 13px Arial, sans-serif; fill: #9f1239; }
    </style>
  </defs>

  <rect width="1520" height="1060" fill="#ffffff"/>
  <text x="44" y="42" class="title">Harnessloop detailed protocol flow</text>
  <text x="44" y="68" class="small">Canonical source: docs/harnessloop-flow.mmd. This SVG is a rendered preview for readers.</text>

  <rect x="44" y="105" width="190" height="64" class="agent"/>
  <text x="139" y="132" text-anchor="middle" class="text">Existing session</text>
  <text x="139" y="153" text-anchor="middle" class="small">no install required</text>

  <rect x="286" y="105" width="210" height="64" class="box"/>
  <text x="391" y="132" text-anchor="middle" class="text">Transfer packet</text>
  <text x="391" y="153" text-anchor="middle" class="small">docs + artifacts + evidence</text>

  <polygon points="630,84 748,137 630,190 512,137" class="decision"/>
  <text x="630" y="133" text-anchor="middle" class="text">Intake gate</text>
  <text x="630" y="153" text-anchor="middle" class="small">complete?</text>

  <rect x="835" y="78" width="200" height="64" class="blocked"/>
  <text x="935" y="105" text-anchor="middle" class="text">Gap review</text>
  <text x="935" y="126" text-anchor="middle" class="small">missing facts only</text>

  <rect x="835" y="170" width="220" height="64" class="audit"/>
  <text x="945" y="197" text-anchor="middle" class="text">Intake-review round</text>
  <text x="945" y="218" text-anchor="middle" class="small">map evidence + draft goal</text>

  <rect x="44" y="285" width="190" height="64" class="box"/>
  <text x="139" y="312" text-anchor="middle" class="text">Setup</text>
  <text x="139" y="333" text-anchor="middle" class="small">data/runtime/policy</text>

  <rect x="286" y="285" width="190" height="64" class="control"/>
  <text x="381" y="312" text-anchor="middle" class="text">Environment check</text>
  <text x="381" y="333" text-anchor="middle" class="small">model + delegation</text>

  <rect x="528" y="285" width="170" height="64" class="audit"/>
  <text x="613" y="312" text-anchor="middle" class="text">Self-audit</text>
  <text x="613" y="333" text-anchor="middle" class="small">setup health</text>

  <rect x="750" y="285" width="190" height="64" class="box"/>
  <text x="845" y="312" text-anchor="middle" class="text">Long-term goal</text>
  <text x="845" y="333" text-anchor="middle" class="small">goal / success</text>

  <rect x="992" y="285" width="190" height="64" class="agent"/>
  <text x="1087" y="312" text-anchor="middle" class="text">Read-only discovery</text>
  <text x="1087" y="333" text-anchor="middle" class="small">subagent / swarm</text>

  <rect x="1234" y="285" width="220" height="64" class="main"/>
  <text x="1344" y="312" text-anchor="middle" class="text">Main approval</text>
  <text x="1344" y="333" text-anchor="middle" class="small">breakdown / order</text>

  <rect x="44" y="465" width="170" height="64" class="box"/>
  <text x="129" y="492" text-anchor="middle" class="text">Subgoal/task</text>
  <text x="129" y="513" text-anchor="middle" class="small">next target</text>

  <rect x="260" y="465" width="190" height="64" class="box"/>
  <text x="355" y="492" text-anchor="middle" class="text">Evidence contract</text>
  <text x="355" y="513" text-anchor="middle" class="small">data + validation</text>

  <rect x="496" y="465" width="180" height="64" class="control"/>
  <text x="586" y="492" text-anchor="middle" class="text">State + control</text>
  <text x="586" y="513" text-anchor="middle" class="small">authority</text>

  <rect x="722" y="465" width="170" height="64" class="audit"/>
  <text x="807" y="492" text-anchor="middle" class="text">Self-audit</text>
  <text x="807" y="513" text-anchor="middle" class="small">pre-continue</text>

  <polygon points="1016,444 1130,497 1016,550 902,497" class="decision"/>
  <text x="1016" y="493" text-anchor="middle" class="text">Continue gate</text>
  <text x="1016" y="513" text-anchor="middle" class="small">allowed?</text>

  <rect x="1200" y="465" width="210" height="64" class="blocked"/>
  <text x="1305" y="492" text-anchor="middle" class="text">Status / human input</text>
  <text x="1305" y="513" text-anchor="middle" class="small">blocked</text>

  <rect x="44" y="650" width="190" height="64" class="control"/>
  <text x="139" y="677" text-anchor="middle" class="text">Scope-lock</text>
  <text x="139" y="698" text-anchor="middle" class="small">minimal / one variable</text>

  <polygon points="374,628 488,682 374,736 260,682" class="decision"/>
  <text x="374" y="678" text-anchor="middle" class="text">Task type</text>
  <text x="374" y="698" text-anchor="middle" class="small">route</text>

  <rect x="550" y="600" width="180" height="64" class="main"/>
  <text x="640" y="627" text-anchor="middle" class="text">Main session</text>
  <text x="640" y="648" text-anchor="middle" class="small">core decision</text>

  <rect x="550" y="710" width="180" height="64" class="agent"/>
  <text x="640" y="737" text-anchor="middle" class="text">Subagent handoff</text>
  <text x="640" y="758" text-anchor="middle" class="small">investigate / execute</text>

  <rect x="805" y="650" width="230" height="64" class="box"/>
  <text x="920" y="677" text-anchor="middle" class="text">Evidence writeback</text>
  <text x="920" y="698" text-anchor="middle" class="small">static / dynamic / runtime / source</text>

  <rect x="1090" y="650" width="190" height="64" class="review"/>
  <text x="1185" y="677" text-anchor="middle" class="text">Adversarial review</text>
  <text x="1185" y="698" text-anchor="middle" class="small">evidence-cited</text>

  <rect x="1090" y="805" width="190" height="64" class="audit"/>
  <text x="1185" y="832" text-anchor="middle" class="text">Self-audit</text>
  <text x="1185" y="853" text-anchor="middle" class="small">validation health</text>

  <polygon points="920,787 1034,837 920,887 806,837" class="decision"/>
  <text x="920" y="833" text-anchor="middle" class="text">Feedback</text>
  <text x="920" y="853" text-anchor="middle" class="small">classify</text>

  <rect x="575" y="805" width="170" height="64" class="done"/>
  <text x="660" y="832" text-anchor="middle" class="text">Archive round</text>
  <text x="660" y="853" text-anchor="middle" class="small">next task</text>

  <rect x="575" y="945" width="230" height="64" class="review"/>
  <text x="690" y="972" text-anchor="middle" class="text">Fault analysis</text>
  <text x="690" y="993" text-anchor="middle" class="small">execution first, goal second</text>

  <rect x="870" y="945" width="210" height="64" class="audit"/>
  <text x="975" y="972" text-anchor="middle" class="text">Self-audit</text>
  <text x="975" y="993" text-anchor="middle" class="small">repeat failure / drift</text>

  <rect x="1190" y="945" width="220" height="64" class="issue"/>
  <text x="1300" y="972" text-anchor="middle" class="text">Evolution issue</text>
  <text x="1300" y="993" text-anchor="middle" class="small">harnessloop-issue</text>

  <path d="M234 137 L286 137" class="line"/>
  <path d="M496 137 L512 137" class="line"/>
  <path d="M748 137 L835 110" class="line"/>
  <text x="775" y="113" class="label">incomplete</text>
  <path d="M935 78 C935 45 391 45 391 105" class="line"/>
  <path d="M715 174 L835 202" class="line"/>
  <text x="755" y="195" class="label">pass</text>
  <path d="M945 234 L945 258 L845 258 L845 285" class="line"/>

  <path d="M234 317 L286 317" class="line"/>
  <path d="M476 317 L528 317" class="line"/>
  <path d="M698 317 L750 317" class="line"/>
  <path d="M940 317 L992 317" class="line"/>
  <path d="M1182 317 L1234 317" class="line"/>
  <path d="M1344 349 L1344 405 L129 405 L129 465" class="line"/>

  <path d="M214 497 L260 497" class="line"/>
  <path d="M450 497 L496 497" class="line"/>
  <path d="M676 497 L722 497" class="line"/>
  <path d="M892 497 L902 497" class="line"/>
  <path d="M1130 497 L1200 497" class="line"/>
  <path d="M807 529 L807 570 L1300 570 L1300 945" class="dash"/>
  <text x="822" y="560" class="issueLabel">loop / drift</text>
  <path d="M1016 550 L1016 575 L139 575 L139 650" class="line"/>

  <path d="M234 682 L260 682" class="line"/>
  <path d="M488 682 L515 682 L515 632 L550 632" class="line"/>
  <path d="M488 682 L515 682 L515 742 L550 742" class="line"/>
  <path d="M730 632 L765 632 L765 682 L805 682" class="line"/>
  <path d="M730 742 L765 742 L765 682 L805 682" class="line"/>
  <path d="M1035 682 L1090 682" class="line"/>
  <path d="M1185 714 L1185 805" class="line"/>
  <path d="M1090 837 L1034 837" class="line"/>
  <path d="M1185 869 L1185 920 L1300 920 L1300 945" class="dash"/>
  <path d="M806 837 L745 837" class="line"/>
  <text x="765" y="827" class="label">positive</text>
  <path d="M920 887 L920 910 L690 910 L690 945" class="line"/>
  <text x="932" y="910" class="label">negative / neutral</text>
  <path d="M805 977 L870 977" class="line"/>
  <path d="M1080 977 L1190 977" class="dash"/>
  <path d="M975 945 C975 910 139 910 139 714" class="line"/>
</svg>
