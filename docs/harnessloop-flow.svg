<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Harnessloop control, self-audit, and evolution flow</title>
  <desc id="desc">Harnessloop setup, environment self-check, self-audit gates, goal decomposition, scoped execution, evidence writeback, adversarial review, feedback handling, and upstream evolution issue processing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
      .agent { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .review { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .control { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 8; }
      .audit { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 8; }
      .issue { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .done { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .blocked { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 8; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #be123c; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .text { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 13px Arial, sans-serif; fill: #334155; }
      .issueLabel { font: 13px Arial, sans-serif; fill: #9f1239; }
    </style>
  </defs>

  <text x="44" y="42" class="title">Harnessloop: control plane, self-audit, evidence, and evolution flow</text>
  <text x="44" y="68" class="small">Status is read-only. Continue must pass control, evidence, environment, and self-audit gates before scoped execution.</text>

  <rect x="44" y="110" width="170" height="66" class="box"/>
  <text x="129" y="137" text-anchor="middle" class="text">Setup</text>
  <text x="129" y="158" text-anchor="middle" class="small">data/runtime/policy</text>

  <rect x="254" y="110" width="190" height="66" class="control"/>
  <text x="349" y="137" text-anchor="middle" class="text">Environment self-check</text>
  <text x="349" y="158" text-anchor="middle" class="small">expected vs observed</text>

  <rect x="484" y="110" width="170" height="66" class="audit"/>
  <text x="569" y="137" text-anchor="middle" class="text">Self-audit</text>
  <text x="569" y="158" text-anchor="middle" class="small">setup health</text>

  <rect x="694" y="110" width="170" height="66" class="box"/>
  <text x="779" y="137" text-anchor="middle" class="text">Long-term goal</text>
  <text x="779" y="158" text-anchor="middle" class="small">goal / success</text>

  <rect x="904" y="110" width="190" height="66" class="agent"/>
  <text x="999" y="137" text-anchor="middle" class="text">Read-only discovery</text>
  <text x="999" y="158" text-anchor="middle" class="small">subagent / swarm</text>

  <rect x="1134" y="110" width="230" height="66" class="main"/>
  <text x="1249" y="137" text-anchor="middle" class="text">Main session approves</text>
  <text x="1249" y="158" text-anchor="middle" class="small">breakdown / order</text>

  <rect x="44" y="245" width="170" height="66" class="box"/>
  <text x="129" y="272" text-anchor="middle" class="text">Subgoal or task</text>
  <text x="129" y="293" text-anchor="middle" class="small">next target</text>

  <rect x="254" y="245" width="190" height="66" class="box"/>
  <text x="349" y="272" text-anchor="middle" class="text">Evidence contract</text>
  <text x="349" y="293" text-anchor="middle" class="small">data + validation</text>

  <rect x="484" y="245" width="190" height="66" class="control"/>
  <text x="579" y="272" text-anchor="middle" class="text">State + control</text>
  <text x="579" y="293" text-anchor="middle" class="small">status / authority</text>

  <rect x="714" y="245" width="180" height="66" class="audit"/>
  <text x="804" y="272" text-anchor="middle" class="text">Self-audit</text>
  <text x="804" y="293" text-anchor="middle" class="small">pre-continue</text>

  <polygon points="1010,226 1122,278 1010,330 898,278" class="decision"/>
  <text x="1010" y="274" text-anchor="middle" class="text">Continue</text>
  <text x="1010" y="294" text-anchor="middle" class="small">gate</text>

  <rect x="1190" y="245" width="210" height="66" class="blocked"/>
  <text x="1295" y="272" text-anchor="middle" class="text">Status / human input</text>
  <text x="1295" y="293" text-anchor="middle" class="small">blocked path</text>

  <rect x="740" y="370" width="210" height="66" class="issue"/>
  <text x="845" y="397" text-anchor="middle" class="text">Evolution issue</text>
  <text x="845" y="418" text-anchor="middle" class="small">redacted context</text>

  <rect x="1010" y="370" width="220" height="66" class="issue"/>
  <text x="1120" y="397" text-anchor="middle" class="text">harness-loop-issue</text>
  <text x="1120" y="418" text-anchor="middle" class="small">upstream analysis</text>

  <rect x="44" y="505" width="210" height="66" class="control"/>
  <text x="149" y="532" text-anchor="middle" class="text">Round scope-lock</text>
  <text x="149" y="553" text-anchor="middle" class="small">minimal / one variable</text>

  <polygon points="390,487 506,538 390,589 274,538" class="decision"/>
  <text x="390" y="534" text-anchor="middle" class="text">Task type</text>
  <text x="390" y="554" text-anchor="middle" class="small">route</text>

  <rect x="580" y="452" width="180" height="66" class="main"/>
  <text x="670" y="479" text-anchor="middle" class="text">Main session</text>
  <text x="670" y="500" text-anchor="middle" class="small">core decision</text>

  <rect x="580" y="562" width="180" height="66" class="agent"/>
  <text x="670" y="589" text-anchor="middle" class="text">Subagent handoff</text>
  <text x="670" y="610" text-anchor="middle" class="small">investigate / execute</text>

  <rect x="840" y="505" width="220" height="66" class="box"/>
  <text x="950" y="532" text-anchor="middle" class="text">Evidence writeback</text>
  <text x="950" y="553" text-anchor="middle" class="small">static / dynamic / runtime / source</text>

  <rect x="1120" y="505" width="190" height="66" class="review"/>
  <text x="1215" y="532" text-anchor="middle" class="text">Adversarial review</text>
  <text x="1215" y="553" text-anchor="middle" class="small">evidence-cited</text>

  <rect x="1120" y="650" width="190" height="66" class="audit"/>
  <text x="1215" y="677" text-anchor="middle" class="text">Self-audit</text>
  <text x="1215" y="698" text-anchor="middle" class="small">validation health</text>

  <polygon points="950,640 1066,690 950,740 834,690" class="decision"/>
  <text x="950" y="686" text-anchor="middle" class="text">Feedback</text>
  <text x="950" y="706" text-anchor="middle" class="small">classify</text>

  <rect x="610" y="660" width="180" height="66" class="done"/>
  <text x="700" y="687" text-anchor="middle" class="text">Archive round</text>
  <text x="700" y="708" text-anchor="middle" class="small">next subgoal/task</text>

  <polygon points="390,642 506,693 390,744 274,693" class="decision"/>
  <text x="390" y="689" text-anchor="middle" class="text">Goal achieved?</text>

  <rect x="80" y="660" width="150" height="66" class="done"/>
  <text x="155" y="698" text-anchor="middle" class="text">Done</text>

  <rect x="610" y="815" width="230" height="66" class="review"/>
  <text x="725" y="842" text-anchor="middle" class="text">Fault analysis</text>
  <text x="725" y="863" text-anchor="middle" class="small">execution first, goal second</text>

  <rect x="900" y="815" width="220" height="66" class="audit"/>
  <text x="1010" y="842" text-anchor="middle" class="text">Self-audit</text>
  <text x="1010" y="863" text-anchor="middle" class="small">repeat failure / drift</text>

  <polygon points="1240,797 1360,848 1240,899 1120,848" class="decision"/>
  <text x="1240" y="844" text-anchor="middle" class="text">Human decision?</text>

  <rect x="900" y="905" width="230" height="66" class="control"/>
  <text x="1015" y="932" text-anchor="middle" class="text">Next scope-lock</text>
  <text x="1015" y="953" text-anchor="middle" class="small">investigate / fix / rollback</text>

  <path d="M214 143 L254 143" class="line"/>
  <path d="M444 143 L484 143" class="line"/>
  <path d="M654 143 L694 143" class="line"/>
  <path d="M864 143 L904 143" class="line"/>
  <path d="M1094 143 L1134 143" class="line"/>
  <path d="M1249 176 L1249 205 L129 205 L129 245" class="line"/>

  <path d="M214 278 L254 278" class="line"/>
  <path d="M444 278 L484 278" class="line"/>
  <path d="M674 278 L714 278" class="line"/>
  <path d="M894 278 L898 278" class="line"/>
  <path d="M1122 278 L1190 278" class="line"/>
  <text x="1146" y="268" class="label">blocked</text>
  <path d="M804 311 L804 370" class="dash"/>
  <text x="812" y="350" class="issueLabel">loop / drift</text>
  <path d="M950 403 L1010 403" class="dash"/>

  <path d="M1010 330 L1010 350 L149 350 L149 505" class="line"/>
  <text x="1022" y="347" class="label">allowed</text>
  <path d="M254 538 L274 538" class="line"/>
  <path d="M506 538 L540 538 L540 485 L580 485" class="line"/>
  <path d="M506 538 L540 538 L540 595 L580 595" class="line"/>
  <path d="M760 485 L800 485 L800 538 L840 538" class="line"/>
  <path d="M760 595 L800 595 L800 538 L840 538" class="line"/>
  <path d="M1060 538 L1120 538" class="line"/>
  <path d="M1215 571 L1215 650" class="line"/>
  <path d="M1120 690 L1066 690" class="line"/>
  <path d="M1215 716 L1215 760 L845 760 L845 436" class="dash"/>
  <text x="1224" y="750" class="issueLabel">framework gap</text>

  <path d="M834 690 L790 690" class="line"/>
  <text x="804" y="678" class="label">positive</text>
  <path d="M610 693 L506 693" class="line"/>
  <path d="M274 693 L230 693" class="line"/>
  <text x="246" y="682" class="label">yes</text>
  <path d="M390 744 L390 775 L129 775 L129 311" class="line"/>
  <text x="402" y="770" class="label">no</text>

  <path d="M950 740 L950 780 L725 780 L725 815" class="line"/>
  <text x="960" y="770" class="label">negative / neutral</text>
  <path d="M840 848 L900 848" class="line"/>
  <path d="M1120 848 L1120 848 L1240 797" class="line"/>
  <path d="M1010 815 L1010 436 L845 436" class="dash"/>
  <text x="1020" y="790" class="issueLabel">framework gap</text>
  <path d="M1240 899 L1240 925 L1130 925" class="line"/>
  <text x="1254" y="920" class="label">no</text>
  <path d="M1360 848 L1430 848 L1430 278 L1400 278" class="line"/>
  <text x="1370" y="837" class="label">yes</text>
  <path d="M1015 905 L1015 890 L149 890 L149 571" class="line"/>
</svg>
