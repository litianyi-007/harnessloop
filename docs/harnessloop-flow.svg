<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-labelledby="title desc">
  <title id="title">Harnessloop flow</title>
  <desc id="desc">Goal-driven harness loop from setup through scope lock, handoff, evidence, adversarial review, archive, next loop, done, or blocked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .agent { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 10; }
      .review { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
      .done { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .blocked { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .label { font: 14px sans-serif; fill: #334155; }
      .title { font: 700 24px sans-serif; fill: #0f172a; }
      .text { font: 15px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>

  <text x="40" y="42" class="title">Harnessloop: goal-driven evidence loop</text>
  <text x="40" y="68" class="small">Scope: minimal framework for setup, handoff, evidence, adversarial review, archive, and next loop.</text>

  <rect x="60" y="110" width="220" height="64" class="box"/>
  <text x="170" y="136" text-anchor="middle" class="text">Plugin setup</text>
  <text x="170" y="158" text-anchor="middle" class="small">用户填写数据连接范围</text>

  <rect x="360" y="110" width="220" height="64" class="box"/>
  <text x="470" y="136" text-anchor="middle" class="text">Define goal</text>
  <text x="470" y="158" text-anchor="middle" class="small">目标、非目标、成功条件</text>

  <rect x="660" y="110" width="220" height="64" class="box"/>
  <text x="770" y="136" text-anchor="middle" class="text">Thresholds</text>
  <text x="770" y="158" text-anchor="middle" class="small">数据门限 + 验证门限</text>

  <rect x="660" y="230" width="220" height="74" class="box"/>
  <text x="770" y="256" text-anchor="middle" class="text">Data contract</text>
  <text x="770" y="278" text-anchor="middle" class="small">真实数据 / 动态数据</text>
  <text x="770" y="296" text-anchor="middle" class="small">源码 / 源数据证据</text>

  <rect x="360" y="230" width="220" height="74" class="box"/>
  <text x="470" y="256" text-anchor="middle" class="text">Round scope-lock</text>
  <text x="470" y="278" text-anchor="middle" class="small">最小改动</text>
  <text x="470" y="296" text-anchor="middle" class="small">或单变量 strict mode</text>

  <polygon points="170,226 280,267 170,308 60,267" class="decision"/>
  <text x="170" y="262" text-anchor="middle" class="text">Task type?</text>
  <text x="170" y="284" text-anchor="middle" class="small">分流任务</text>

  <rect x="60" y="390" width="220" height="74" class="main"/>
  <text x="170" y="416" text-anchor="middle" class="text">Main session</text>
  <text x="170" y="438" text-anchor="middle" class="small">编排与核心决策</text>

  <rect x="360" y="390" width="220" height="74" class="agent"/>
  <text x="470" y="416" text-anchor="middle" class="text">Subagent / swarm</text>
  <text x="470" y="438" text-anchor="middle" class="small">独立调查 / 低上下文执行</text>

  <rect x="660" y="390" width="220" height="74" class="box"/>
  <text x="770" y="416" text-anchor="middle" class="text">Evidence writeback</text>
  <text x="770" y="438" text-anchor="middle" class="small">static / dynamic / source</text>

  <rect x="660" y="535" width="220" height="74" class="review"/>
  <text x="770" y="561" text-anchor="middle" class="text">Adversarial review</text>
  <text x="770" y="583" text-anchor="middle" class="small">基于证据验收</text>

  <polygon points="470,531 590,572 470,613 350,572" class="decision"/>
  <text x="470" y="567" text-anchor="middle" class="text">Gates pass?</text>
  <text x="470" y="589" text-anchor="middle" class="small">门限通过?</text>

  <rect x="60" y="535" width="220" height="74" class="box"/>
  <text x="170" y="561" text-anchor="middle" class="text">Archive round</text>
  <text x="170" y="583" text-anchor="middle" class="small">summary + decision + handoffs</text>

  <polygon points="170,660 280,701 170,742 60,701" class="decision"/>
  <text x="170" y="696" text-anchor="middle" class="text">Goal achieved?</text>
  <text x="170" y="718" text-anchor="middle" class="small">目标达成?</text>

  <rect x="360" y="664" width="220" height="74" class="box"/>
  <text x="470" y="690" text-anchor="middle" class="text">Next scope-lock</text>
  <text x="470" y="712" text-anchor="middle" class="small">继续下一轮最小改动</text>

  <rect x="660" y="664" width="180" height="74" class="done"/>
  <text x="750" y="703" text-anchor="middle" class="text">Done</text>

  <polygon points="965,531 1085,572 965,613 845,572" class="decision"/>
  <text x="965" y="567" text-anchor="middle" class="text">Human decision?</text>
  <text x="965" y="589" text-anchor="middle" class="small">必须人工判断?</text>

  <rect x="930" y="664" width="180" height="74" class="blocked"/>
  <text x="1020" y="690" text-anchor="middle" class="text">Blocked</text>
  <text x="1020" y="712" text-anchor="middle" class="small">请求人工输入</text>

  <rect x="930" y="390" width="180" height="74" class="review"/>
  <text x="1020" y="416" text-anchor="middle" class="text">Reject round</text>
  <text x="1020" y="438" text-anchor="middle" class="small">收敛后继续</text>

  <path d="M280 142 H360" class="line"/>
  <path d="M580 142 H660" class="line"/>
  <path d="M770 174 V230" class="line"/>
  <path d="M660 267 H580" class="line"/>
  <path d="M360 267 H280" class="line"/>
  <path d="M170 308 V390" class="line"/>
  <path d="M280 267 H360" class="line"/>
  <path d="M580 427 H660" class="line"/>
  <path d="M280 427 H360" class="line"/>
  <path d="M770 464 V535" class="line"/>
  <path d="M660 572 H590" class="line"/>
  <path d="M350 572 H280" class="line"/>
  <path d="M170 609 V660" class="line"/>
  <path d="M280 701 H360" class="line"/>
  <path d="M580 701 H660" class="line"/>
  <path d="M470 664 V625 Q470 625 350 625 Q170 625 170 609" class="line"/>
  <path d="M590 572 H845" class="line"/>
  <path d="M965 613 V664" class="line"/>
  <path d="M965 531 V464" class="line"/>
  <path d="M930 427 H880" class="line"/>

  <text x="112" y="360" class="label">核心决策</text>
  <text x="306" y="250" class="label">执行/调查</text>
  <text x="608" y="555" class="label">验收</text>
  <text x="300" y="685" class="label">no</text>
  <text x="605" y="685" class="label">yes</text>
  <text x="605" y="555" class="label">no</text>
  <text x="975" y="642" class="label">yes</text>
  <text x="980" y="500" class="label">no</text>
</svg>
